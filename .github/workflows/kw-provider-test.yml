name: KW alternative source unit validation
on:
  push:
    branches:
      - feat/ekw-direct-browser-adapter
    paths:
      - services/ekw-direct/apify-client.mjs
      - services/ekw-direct/apify-client.test.mjs
      - services/ekw-direct/apify-probe.mjs
      - .github/workflows/kw-provider-test.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/ekw-direct/apify-client.test.mjs
      - run: node --check services/ekw-direct/apify-probe.mjs
