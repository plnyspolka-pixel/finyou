name: MSiG direct public JSON endpoint diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msig:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun scripts/msig-api-direct-probe.ts
