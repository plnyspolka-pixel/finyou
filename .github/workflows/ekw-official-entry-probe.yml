name: EKW same-methods-as-MSiG reachability test
# Manual only: automated runs repeatedly hit EKW WAF 403.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright browser
        run: |
          cd services/ekw-direct
          npm install
          npx playwright install --with-deps chromium
      - name: Compare Python urllib MSiG and EKW with cookie session
        run: python services/ekw-direct/official-entry-urllib.py
      - name: Compare HTTP fetch vs browser and official EKW entry flow
        run: node services/ekw-direct/official-entry-probe.mjs
