name: Finance You current fetch/Jina diagnostics
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - 'scripts/kw-fetch-jina-probe.ts'
      - '.github/workflows/kw-fetch-jina-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Execute existing fetching engine against public KRZ family pages
        run: bun scripts/kw-fetch-jina-probe.ts
