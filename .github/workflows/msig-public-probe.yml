name: MSiG official public search diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msig:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install isolated Chromium
        shell: bash
        run: |
          mkdir -p /tmp/msig-playwright
          npm install --prefix /tmp/msig-playwright --no-audit --no-fund playwright
          cd /tmp/msig-playwright
          npx playwright install --with-deps chromium
          ln -s /tmp/msig-playwright/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Check official portal and iMSiG restrictions
        shell: bash
        run: |
          bun scripts/msig-public-probe.ts
