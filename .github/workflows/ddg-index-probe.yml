name: Search-index DDG fallback diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - 'scripts/ddg-index-probe.mjs'
      - '.github/workflows/ddg-index-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ddg-index-probe.mjs
