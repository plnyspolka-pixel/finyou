name: Resend inbox API checks

on:
  pull_request:
    paths:
      - 'src/lib/resend-receiv*'
      - 'src/routes/api/admin/resend-inbox.ts'
      - 'src/routes/admin.skrzynka.tsx'
      - '.github/workflows/resend-inbox-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/resend-receiv*'
      - 'src/routes/api/admin/resend-inbox.ts'
      - 'src/routes/admin.skrzynka.tsx'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Resend API
        run: bunx vitest run src/lib/resend-receiving.test.ts
      - name: Generate TanStack route types
        run: bunx -p @tanstack/router-cli@1.167.46 tsr generate
      - name: TypeScript typecheck
        run: bun run typecheck
