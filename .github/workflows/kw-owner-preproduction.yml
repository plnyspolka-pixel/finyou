name: KW owner preproduction build gate
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'src/lib/coowners/**'
      - 'src/lib/investor-analytics/**'
      - 'src/lib/investor-agreements/order-report-teaser.ts'
      - 'src/components/inwestor/analytics-steps.tsx'
      - '.github/workflows/kw-owner-preproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run owner intelligence tests
        run: bunx vitest run src/lib/coowners/owner-intelligence.test.ts src/lib/coowners/public-index-search.test.ts src/lib/coowners/official-msig.test.ts
      - name: Production bundle
        run: bun run build
