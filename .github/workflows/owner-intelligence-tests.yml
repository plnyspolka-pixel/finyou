name: Owner intelligence indexed search tests
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - 'src/lib/coowners/owner-intelligence*'
      - 'src/lib/coowners/public-index-search*'
      - '.github/workflows/owner-intelligence-tests.yml'
      - 'tsconfig.owner-intelligence.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Unit tests (no external service or personal records)
        run: bunx vitest run src/lib/coowners/owner-intelligence.test.ts src/lib/coowners/public-index-search.test.ts
      - name: TypeScript typecheck (owner intelligence scope)
        run: bunx tsc --project tsconfig.owner-intelligence.json --noEmit
