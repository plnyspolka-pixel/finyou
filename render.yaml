# Render.com — DARMOWY hosting usługi wypalania napisów (Blueprint).
# Render → New → Blueprint → wskaż to repo → Apply. Plan „free": usługa usypia
# po 15 min bez ruchu i budzi się ok. minutę przy pierwszym zapytaniu — klient
# w src/lib/caption-burner.server.ts czeka na to (limit 120 s), a przerwane
# zadania usługa wznawia z dysku. Po wdrożeniu skopiuj adres usługi i wartość
# CAPTION_BURNER_SECRET (zakładka Environment) do sekretów Finance You.
# Szczegóły: services/caption-burner/README.md.
services:
  - type: web
    name: finyou-caption-burner
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: services/caption-burner
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CAPTION_BURNER_SECRET
        generateValue: true
      # 0,1 vCPU na planie free — najszybszy preset, jakość dla rolek wystarcza.
      - key: FFMPEG_PRESET
        value: ultrafast
      # Kompresja przed publikacją (zadanie transcode) dostaje surowe filmy
      # z biblioteki materiałów — bywają po kilkaset MB.
      - key: MAX_INPUT_MB
        value: "500"
      # 0,1 vCPU koduje 3-minutowy film 1080p nawet pół godziny; limit
      # kodowania i tak jest pilnowany po stronie Finance You (2 h).
      - key: TRANSCODE_TIMEOUT_SECONDS
        value: "5400"
